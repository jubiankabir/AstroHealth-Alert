<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>AstroHealth Alert</title>
</head>
<body>
    <header>
        <div class="websitetitle">AstroHealth Alert</div>
        <div class="profile">
            <img src="assets/pfp.png" alt="" class="pfp">
        </div>
    </header>

    <div class="status">
        <div class="bpm">
            <h1>Heart Rate</h1>
            <div class="p">BPM: 72</div>
            <img src="assets/heart.png" alt="" class="graph">
            <div class="statusbar"></div>
        </div>
        <div class="sleep">
            <h1>Sleep</h1>
            <div class="p">Sleep: 8 hours</div>
            <img src="assets/Sleep.png" alt="" class="graph">
            <div class="statusbar"></div>
        </div>
        <div class="fatigue">
            <h1>Fatigue</h1>
            <div class="p">Fatigue: 30%</div>
            <img src="assets/Fatigue.png" alt="" class="graph">
            <div class="statusbar"></div>
        </div>
        <div class="radiation">
            <h1>Radiation</h1>
            <div class="p">Radiation: 50 mSv</div>
            <img src="assets/Radiation.png" alt="" class="graph">
            <div class="statusbar"></div>
        </div>
    </div>

    <footer>
        <img src="assets/logo.png" alt="NASA Logo" class="nasa">
        <div class="timer">10:00:00</div>
    </footer>
</body>
</html>
