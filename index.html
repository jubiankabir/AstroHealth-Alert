<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>AstroHealth Alert</title>
</head>
<body>
    <div class="header">
        <div class="websitetitle">AstroHealth Alert</div>
        <div class="profile">
            <div class="pic">Hi</div>
        </div>
    </div>

    <div class="status">
        <div class="bpm">
            <img src="" alt="" class="graph">
            <div class="p">BPM: 72</div>
            <div class="statusbar"></div>
        </div>
        <div class="sleep">
            <img src="" alt="" class="graph">
            <div class="p">Sleep: 8 hours</div>
            <div class="statusbar"></div>
        </div>
        <div class="fatigue">
            <img src="" alt="" class="graph">
            <div class="p">Fatigue: 30%</div>
            <div class="statusbar"></div>
        </div>
        <div class="radiation">
            <img src="" alt="" class="graph">
            <div class="p">Radiation: 50 mSv</div>
            <div class="statusbar"></div>
        </div>
    </div>

    <div class="footer">
        <div class="logo">Nasa</div>
        <div class="timer">10:00:00</div>
    </div>
</body>
</html>
